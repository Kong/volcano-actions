# Runs one step of the AI review for the ai-review workflows. The scripts,
# policy, and schema ship with this action, so callers load them from this
# repository rather than from the PR they review.
name: AI review
description: Prepares a reviewer's inputs, marks a head under review, publishes the combined verdict and each reviewer's inline comments, applies an override, or re-sets the human review status and the review's own approval.

inputs:
  step:
    description: prepare, start, publish, override, or gate.
    required: true
  focus:
    description: For prepare, extra review focus bullets appended to the policy's shared list.
    default: ''
  reviews:
    description: For publish, the verdict job's `toJSON(needs)`, which must list only reviewer jobs. Every job in it is a reviewer, named by its `reviewer` output or its job ID. Its `model` output, such as `claude-opus-5-5`, signs the inline comments publish posts for its findings, or its name does when unset. Its structured output is a file in `review-outputs`.
    default: ''
  review-outputs:
    description: For publish, the directory holding each reviewer job's structured output as `ai-review-<job ID>.json`, which the job uploads as the artifact `ai-review-<job ID>`. Download the artifacts with `merge-multiple` set, which puts every file directly in the directory. An output can outgrow the 128 KiB an environment variable holds, so it never travels as a job output. A job that succeeded without a readable file did not complete its review.
    default: ''
  human-review-paths:
    description: For publish, newline-separated globs of paths whose changes need a human review. A glob followed by `except` and comma-separated logins does not reserve its paths in those authors' own PRs.
    default: ''
  feature-flag-check:
    description: For publish, a JavaScript regular expression that a line checking a feature flag matches, such as `useFeatureFlags|requireFeature`. A self-approver's scope behind a feature flag holds only when each check the review cites matches it, names the flag in quotes, and is a line the PR did not add or change. Without it, no such scope holds.
    default: ''
  owners:
    description: For publish, the owners of the repository's paths, one line each as a glob and logins, such as `apps/web/** @octocat @hubot`. When a PR needs a person, the human status counts only an approval from an owner of each owned path it changes. A file's owners are those of the last line matching it, globs match as in human-review-paths, and the PR author never counts as an owner.
    default: ''
  self-approvers:
    description: For prepare, publish, override, and gate, the authors whose PRs the review approves itself when nothing calls for a person, for repositories that keep required approvals. One per line, as `login` or `login, reviewed by login`, then optionally `:` and a change they may merge without a person, completing "a change that is ...". Before the colon, `, behind a feature flag` makes the scope hold only on flag checks publish verifies (see feature-flag-check). Each line adds a scope, and `*` lines add theirs for every author who is a person. The named reviewer is asked whenever their PR needs a person. Without it, the review only withdraws approvals it gave.
    default: ''

outputs:
  review:
    description: For start, 'true' when the head needs a review.
    value: ${{ steps.run.outputs.review }}
  inputs:
    description: For prepare, the directory holding the reviewer's inputs.
    value: ${{ steps.run.outputs.inputs }}
  candidates:
    description: For prepare, a JSON list of logins to suggest as the human reviewer, most history first.
    value: ${{ steps.run.outputs.candidates }}
  policy:
    description: For prepare, the review policy prompt with this PR's values and the focus filled in.
    value: ${{ steps.run.outputs.policy }}
  schema:
    description: For prepare, the JSON schema of a reviewer's structured output, on one line.
    value: ${{ steps.run.outputs.schema }}
  schema-without-max-length:
    description: For prepare, the same schema without maxLength, for providers whose structured outputs reject it.
    value: ${{ steps.run.outputs.schema-without-max-length }}

runs:
  using: composite
  steps:
    # Runs in the caller's base checkout at the workspace root, before any
    # reviewer starts, and only reads the PR head.
    - if: inputs.step == 'prepare'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUTS: ${{ runner.temp }}/ai-review
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      # Inputs reach the script through env, never by interpolation into it.
      env:
        AI_REVIEW_SCRIPT: ${{ github.action_path }}/ai-review.cjs
        AI_REVIEW_STEP: ${{ inputs.step }}
        INPUTS: ${{ runner.temp }}/ai-review
        FOCUS: ${{ inputs.focus }}
        REVIEWS: ${{ inputs.reviews }}
        REVIEW_OUTPUTS: ${{ inputs.review-outputs }}
        HUMAN_REVIEW_PATHS: ${{ inputs.human-review-paths }}
        SELF_APPROVERS: ${{ inputs.self-approvers }}
        FEATURE_FLAG_CHECK: ${{ inputs.feature-flag-check }}
        OWNERS: ${{ inputs.owners }}
      with:
        retries: 3
        script: |
          const review = require(process.env.AI_REVIEW_SCRIPT);
          const step = process.env.AI_REVIEW_STEP;
          if (!['prepare', 'start', 'publish', 'override', 'gate'].includes(step)) throw new Error(`Unknown AI review step: ${step}`);
          await review[step]({ github, context, core });
