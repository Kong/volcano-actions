# Runs one step of the AI review for the ai-review workflows. The scripts,
# policy, and schema ship with this action, so callers load them from this
# repository rather than from the PR they review.
name: AI review
description: Prepares a reviewer's inputs, marks a head under review, publishes the combined verdict and each reviewer's inline comments, applies an override, re-sets the human review status, or records what the reviews cost.

inputs:
  step:
    description: prepare, start, publish, override, gate, usage, or cost.
    required: true
  focus:
    description: For prepare, extra review focus bullets appended to the policy's shared list.
    default: ''
  reviews:
    description: For publish, the verdict job's `toJSON(needs)`, which must list only reviewer jobs. Every job in it is a reviewer, named by its `reviewer` output or its job ID. Its `model` output, such as `claude-opus-5-5`, signs the inline comments publish posts for its findings, or its name does when unset. Its structured output is a file in `review-outputs`. For cost, the cost job's `toJSON(needs)`, as `usage-outputs` describes.
    default: ''
  review-outputs:
    description: For publish, the directory holding each reviewer job's structured output as `ai-review-<job ID>.json`, which the job uploads as the artifact `ai-review-<job ID>`. Download the artifacts with `merge-multiple` set, which puts every file directly in the directory. An output can outgrow the 128 KiB an environment variable holds, so it never travels as a job output. A job that succeeded without a readable file did not complete its review.
    default: ''
  human-review-paths:
    description: For publish, newline-separated globs of paths whose changes need a human review.
    default: ''
  provider:
    description: For usage, the reviewer's CLI whose session log to read, `claude` or `codex`.
    default: ''
  model:
    description: For usage, the model the reviewer ran, for a session log that does not name it.
    default: ''
  usage-file:
    description: For usage, the file to write the reviewer's usage to, `ai-review-usage-<job ID>.json`, which the job uploads as the artifact of that name. Only token counts and times leave the runner, never the session log.
    default: ''
  usage-outputs:
    description: For cost, the directory holding each reviewer job's usage file, downloaded with `merge-multiple` set. `reviews` is the cost job's `toJSON(needs)`; any job in it without a usage file or a `reviewer` output is not a reviewer.
    default: ''
  otlp-endpoint:
    description: For cost, the base URL of an OTLP/HTTP collector to send the review's cost to, as OTEL_EXPORTER_OTLP_ENDPOINT takes it. Unset sends nothing.
    default: ''
  otlp-headers:
    description: For cost, the collector's request headers as `key=value,key=value`, as OTEL_EXPORTER_OTLP_HEADERS takes them. Pass it from a secret.
    default: ''

outputs:
  review:
    description: For start, 'true' when the head needs a review.
    value: ${{ steps.run.outputs.review }}
  inputs:
    description: For prepare, the directory holding the reviewer's inputs.
    value: ${{ steps.run.outputs.inputs }}
  candidates:
    description: For prepare, a JSON list of logins to suggest as the human reviewer, most history first.
    value: ${{ steps.run.outputs.candidates }}
  policy:
    description: For prepare, the review policy prompt with this PR's values and the focus filled in.
    value: ${{ steps.run.outputs.policy }}
  schema:
    description: For prepare, the JSON schema of a reviewer's structured output, on one line.
    value: ${{ steps.run.outputs.schema }}
  schema-without-max-length:
    description: For prepare, the same schema without maxLength, for providers whose structured outputs reject it.
    value: ${{ steps.run.outputs.schema-without-max-length }}

runs:
  using: composite
  steps:
    # Runs in the caller's base checkout at the workspace root, before any
    # reviewer starts, and only reads the PR head.
    - if: inputs.step == 'prepare'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUTS: ${{ runner.temp }}/ai-review
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      # Inputs reach the script through env, never by interpolation into it.
      env:
        AI_REVIEW_SCRIPT: ${{ github.action_path }}/ai-review.cjs
        AI_REVIEW_STEP: ${{ inputs.step }}
        INPUTS: ${{ runner.temp }}/ai-review
        FOCUS: ${{ inputs.focus }}
        REVIEWS: ${{ inputs.reviews }}
        REVIEW_OUTPUTS: ${{ inputs.review-outputs }}
        HUMAN_REVIEW_PATHS: ${{ inputs.human-review-paths }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        USAGE_FILE: ${{ inputs.usage-file }}
        USAGE_OUTPUTS: ${{ inputs.usage-outputs }}
        OTLP_ENDPOINT: ${{ inputs.otlp-endpoint }}
        OTLP_HEADERS: ${{ inputs.otlp-headers }}
      with:
        retries: 3
        script: |
          const review = require(process.env.AI_REVIEW_SCRIPT);
          const step = process.env.AI_REVIEW_STEP;
          if (!['prepare', 'start', 'publish', 'override', 'gate', 'usage', 'cost'].includes(step)) throw new Error(`Unknown AI review step: ${step}`);
          await review[step]({ github, context, core });
