# Runs one step of claude-review.cjs for the Claude review workflows.
# The script ships with this action, so callers load it from this repository
# rather than from the PR they review.
name: Claude review verdict
description: Marks a head under review, finds reviewer candidates, publishes its verdict, applies an override, or re-sets its human review status.

inputs:
  step:
    description: start, candidates, publish, override, or gate.
    required: true
  review-result:
    description: For publish, the review job's result.
    default: ''
  findings:
    description: For publish, the review job's structured output.
    default: ''
  human-review-paths:
    description: For publish, newline-separated globs of paths whose changes need a human review.
    default: ''
  reviewer-candidates:
    description: For publish, the candidates step's JSON list of logins.
    default: ''
  codex-result:
    description: For publish, the Codex review job's result. Leave it empty when the workflow runs no Codex review.
    default: ''
  codex-findings:
    description: For publish, the Codex review's structured output, in the same shape as findings.
    default: ''

outputs:
  review:
    description: For start, 'true' when the head needs a review.
    value: ${{ steps.run.outputs.review }}
  candidates:
    description: For candidates, a JSON list of logins to suggest as the human reviewer, most history first.
    value: ${{ steps.run.outputs.candidates }}

runs:
  using: composite
  steps:
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      # Inputs reach the script through env, never by interpolation into it.
      env:
        CLAUDE_REVIEW_SCRIPT: ${{ github.action_path }}/claude-review.cjs
        CLAUDE_REVIEW_STEP: ${{ inputs.step }}
        REVIEW_RESULT: ${{ inputs.review-result }}
        FINDINGS: ${{ inputs.findings }}
        HUMAN_REVIEW_PATHS: ${{ inputs.human-review-paths }}
        REVIEWER_CANDIDATES: ${{ inputs.reviewer-candidates }}
        CODEX_RESULT: ${{ inputs.codex-result }}
        CODEX_FINDINGS: ${{ inputs.codex-findings }}
      with:
        retries: 3
        script: |
          const review = require(process.env.CLAUDE_REVIEW_SCRIPT);
          const step = process.env.CLAUDE_REVIEW_STEP;
          if (!['start', 'candidates', 'publish', 'override', 'gate'].includes(step)) throw new Error(`Unknown Claude review step: ${step}`);
          await review[step]({ github, context, core });
