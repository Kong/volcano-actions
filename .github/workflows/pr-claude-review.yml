# This repository's own Claude review: the first caller stub other Volcano
# repositories copy. See README.md.

name: Claude Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  claude-review:
    uses: Kong/volcano-actions/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    # This repository is not in the team-volcano federation.
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
