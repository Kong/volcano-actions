# Reusable AI review for Volcano repositories. Each repository calls it from a
# pull_request_target workflow (see README.md). Each reviewer job below reviews
# every push to a same-repository PR, and one verdict combines them as the
# `ai-review/verdict` commit status on the reviewed head. Findings are ranked
# P0-P3, as Codex review ranks them; a P0-P2 finding from any reviewer fails
# it. It also reports `ai-review/human`, which waits for a person's approval
# when a reviewer, a reserved path, the needs-human-review label, an override,
# or a fork calls for one, and passes otherwise. A repository that requires it
# can drop its required approvals. When it waits, the review asks one
# collaborator by name: the first reviewer's pick among those with recent
# history in the changed files. ai-review-human.yml re-sets it when reviews or
# that label change. Reviewers that do not complete leave the verdict to those
# that did; when none does, the verdict is an error and the head waits for a
# person.
#
# To add a provider, add a job like `claude` and `codex`, list it in
# `verdict.needs`, and add its API key secret to workflow_call.
#
# - The policy (.github/actions/ai-review/policy.md) defines each level by
#   what happens if it is not fixed and never says which levels fail, so a
#   reviewer ranks the problem rather than the gate. Likewise it defines when a
#   person is needed by the change, never by what that decision lets the PR
#   skip. Each reviewer job adds only how its provider reads, comments, and
#   returns its verdict.
# - pull_request_target runs as the caller's base branch, which supplies the
#   stub and the API key secrets it passes. Every job skips on any other
#   trigger.
# - A PR cannot edit its judge: the caller reads its stub from the base branch,
#   and this workflow and .github/actions/ai-review come from trusted
#   revisions of this repository.
# - Callers grant the permissions these jobs use; a called workflow can only
#   reduce them. Callers set no concurrency, so they cannot deadlock with this
#   workflow's group.
# - Fork heads are refused: this trigger runs with base credentials and the
#   fork-approval setting does not gate it.
# - Each reviewer runs in a base-branch checkout and gets the PR head as data
#   in a separate directory, never executed, which the action's prepare step
#   writes without the head's instruction and MCP files.
# - The claude job gives Claude no shell (git and gh arguments alone can write
#   or publish runner files) and reads only the checkouts and prepared inputs.
#   Its instructions and hooks come from the base and its MCP servers only from
#   the action, so the PR cannot instruct its reviewer or run code on this
#   runner.
# - The codex job gives Codex the same prepared inputs in a read-only sandbox
#   with no network and no write token, and drops the checkout's credentials
#   before Codex starts, since it can read any file on the runner.
# - Statuses are per-SHA, so skipped runs never overwrite a verdict, a failed
#   review is `error`, and a cancelled one stays `pending`.
# - `ai-review-override` passes one head over a failing verdict (or a fork),
#   and then the head needs a human review; ai-review-merge-queue.yml passes
#   merge-group commits.

name: AI Review

on:
  workflow_call:
    inputs:
      focus:
        description: Extra review focus bullets for the calling repository, appended to the policy's shared list.
        type: string
        default: ''
      human_review_paths:
        description: Newline-separated globs of paths whose changes always need a human review, whatever the reviewers decide.
        type: string
        default: ''
      # Dependabot's pull_request_target runs keep the requested write token.
      # GitHub makes it read-only only when the PR's base branch was created by
      # Dependabot, and callers review PRs into main.
      allowed_bots:
        description: Bots whose PRs are reviewed. The providers' actions refuse other bots, which errors the verdict.
        type: string
        default: dependabot[bot],kong[bot],kong-volcano-app[bot]
    secrets:
      anthropic_api_key:
        description: The Anthropic API key the claude job calls Claude with. Every caller passes it; the claude job fails without it.
        required: false
      openai_api_key:
        description: The OpenAI API key the codex job calls Codex with. Every caller passes it; the codex job fails without it.
        required: false

permissions: {}

# Events for one head share a group, so a retarget cancels that head's review
# in progress. GitHub does not guarantee runs enter a group in event order, so
# a run never shares a group with another head's: a stale run could cancel the
# live head's review and then skip, leaving the head without a verdict.
# start() skips a head the PR has moved past. Other events (labels, edits,
# reopens, which a triage user can send) get their own group so they never
# cancel a review in progress. A re-run waits rather than cancelling the
# current head's review.
concurrency:
  group: ai-review-${{ (contains(fromJSON('["opened","synchronize","ready_for_review"]'), github.event.action) || (github.event.action == 'edited' && github.event.changes.base)) && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.run_id }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  start:
    # New commits, and retargets onto a reviewed base. start() skips drafts by
    # the live PR, because the payload's draft flag can predate ready_for_review.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'labeled' &&
      (github.event.action != 'edited' || github.event.changes.base) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      review: ${{ steps.start.outputs.review }}
    steps:
      # This job has a write token. Never check out the PR.
      - id: start
        uses: Kong/volcano-actions/.github/actions/ai-review@cd3c62db2fed8a93ba704dae434a9d477856fe2e
        with:
          step: start

  claude:
    needs: start
    if: needs.start.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    outputs:
      reviewer: Claude
      findings: ${{ steps.claude.outputs.structured_output }}
      candidates: ${{ steps.prepare.outputs.candidates }}
    steps:
      # A required secret that is unset fails the run before start, which
      # leaves the head with no verdict that an approval or override could
      # clear. Failing here leaves the verdict to the other reviewers, or makes
      # it an error when none completes.
      - name: Require the API key
        env:
          KEY_SET: ${{ secrets.anthropic_api_key != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::The caller must pass the anthropic_api_key secret, for example from ANTHROPIC_CI_API_KEY."
            exit 1
          fi
      # The base branch sits at the workspace root, so everything Claude and
      # the action load from there (CLAUDE.md, .claude/, and the files their
      # hooks and symlinks reach) is trusted. The PR head is only data, in a
      # separate directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # Prepare fetches the head once the PR has moved past it, and the
          # Claude action fetches the base branch to restore its config from it.
          persist-credentials: true
      # Writes the review inputs, and reviewers.jsonl from the base branch's
      # history of the changed files, before Claude runs; the PR's own commits
      # can name any author.
      - id: prepare
        uses: Kong/volcano-actions/.github/actions/ai-review@cd3c62db2fed8a93ba704dae434a9d477856fe2e
        with:
          step: prepare
          focus: ${{ inputs.focus }}
      - id: claude
        # A job timeout reports `cancelled` and would leave the head pending,
        # where no override applies; a step timeout fails the job instead.
        timeout-minutes: 40
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          # The action stops at the first SDK result; keep subagent work in that turn.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          # Use the job's own token instead of the Claude GitHub App, which isn't
          # installed on the calling repositories. Scoped by the permissions: block above.
          github_token: ${{ github.token }}
          # The action refuses bot-triggered runs by default; these bots open and
          # push the calling repository's own PRs.
          allowed_bots: ${{ inputs.allowed_bots }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          # Reads stay in the base checkout and the --add-dir inputs; .git holds
          # the credential include, and runner token files live outside both.
          # --strict-mcp-config (below) loads only the action's own MCP servers:
          # the action enables every project .mcp.json server, and a caller's
          # can fetch and run unpinned code (for example `npx pkg@latest`) on
          # a runner that holds the API key and a pull-request-write token.
          settings: |
            {"permissions":{"blockReadsOutsideWorkingDirectories":true,"disableBypassPermissionsMode":"disable","deny":["Read(/${{ github.workspace }}/.git/**)","WebFetch","WebSearch"]}}
          prompt: |
            ${{ steps.prepare.outputs.policy }}

            The working directory's AGENTS.md, CLAUDE.md, and .claude/ files
            are the repository's instructions. Pass the head checkout's path to
            Grep and Glob, which otherwise search the base.

            If the PR receives a later push, ignore it; a new run reviews that
            push.

            Earlier runs may already have commented on this PR:
            ${{ steps.prepare.outputs.inputs }}/review-comments.jsonl lists the
            inline comments already on it, one JSON object per line. Post an
            inline comment for each finding that has no comment about the same
            problem in review-comments.jsonl, starting its body with its level
            in bold: **🔴 P0:**, **🟠 P1:**, **🟡 P2:**, **⚪ P3:**, or
            **🟣 Pre-existing:**. Give its path as findings give theirs, and
            pass `${{ github.event.pull_request.head.sha }}` as `commit_id` so
            the comment is attached to the reviewed revision. Do not post a
            summary comment; the workflow publishes one from your structured
            output.

            Your structured output is the verdict for this exact head SHA. List
            every finding that applies to the current diff, including ones
            raised in earlier comments that the code still has, and omit ones
            the code has since fixed. Return an empty findings list if there
            are none, and decide human_review for the change at this head.
          # The schema rides in single quotes; the action's tests keep quotes out of it.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --json-schema '${{ steps.prepare.outputs.schema }}'
            --add-dir ${{ steps.prepare.outputs.inputs }}
            --strict-mcp-config
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"

  codex:
    needs: start
    if: needs.start.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Prepare reads the PR's description and inline comments.
      pull-requests: read
    outputs:
      reviewer: Codex
      findings: ${{ steps.codex.outputs.final-message }}
      candidates: ${{ steps.prepare.outputs.candidates }}
    steps:
      # A missing key fails this job, which leaves the verdict to the other
      # reviewers.
      - name: Require the API key
        env:
          KEY_SET: ${{ secrets.openai_api_key != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::The caller must pass the openai_api_key secret, for example from OPENAI_CI_API_KEY."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # Prepare fetches the head once the PR has moved past it.
          persist-credentials: true
      # Writes the same inputs as the claude job, before the credentials go.
      - id: prepare
        uses: Kong/volcano-actions/.github/actions/ai-review@cd3c62db2fed8a93ba704dae434a9d477856fe2e
        with:
          step: prepare
          focus: ${{ inputs.focus }}
      # Codex can read any file on the runner, so the checkout's token goes
      # before it starts.
      - name: Drop the checkout credentials
        run: |
          git config --local --name-only --get-regexp '^includeif\.' | while read -r key; do
            git config --local --unset-all "$key"
          done
          rm -f "$RUNNER_TEMP"/git-credentials-*.config
          git config --local --unset-all http.https://github.com/.extraheader || true
      - id: codex
        # A job timeout reports `cancelled` and would leave the head pending,
        # where no override applies; a step timeout fails the job instead.
        timeout-minutes: 40
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.openai_api_key }}
          codex-version: 0.162.1
          # No writes and no network. The default drop-sudo safety strategy
          # keeps the key in a proxy Codex cannot reach.
          permission-profile: ':read-only'
          effort: high
          # The action refuses runs by users without write access; these bots
          # open and push the calling repository's own PRs.
          allow-bot-users: ${{ inputs.allowed_bots }}
          # Structured outputs reject maxLength; publish caps the lengths instead.
          output-schema: ${{ steps.prepare.outputs.schema-without-max-length }}
          prompt: |
            ${{ steps.prepare.outputs.policy }}

            The working directory's AGENTS.md files are the repository's
            instructions. Use only commands that read, such as rg, cat, sed,
            and git log or git show; run no tests, builds, or installs.

            Your final message is the verdict for this exact head SHA, as JSON
            that matches the output schema. List every finding that applies to
            the current diff. Return an empty findings list if there are none,
            and decide human_review for the change at this head.

  verdict:
    needs: [claude, codex]
    # Publishes once every reviewer job ends, if any succeeded or failed. A run
    # cancelled before any finished publishes nothing; its SHA stays pending.
    if: always() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure'))
    runs-on: ubuntu-latest
    # Merging two reviews into one takes a model call.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # This job has a write token. Never check out the PR.
      - uses: Kong/volcano-actions/.github/actions/ai-review@cd3c62db2fed8a93ba704dae434a9d477856fe2e
        with:
          step: publish
          reviews: ${{ toJSON(needs) }}
          human-review-paths: ${{ inputs.human_review_paths }}
          # Merge the reviews into one. Without a working key, publish merges
          # them without a model.
          anthropic-api-key: ${{ secrets.anthropic_api_key }}
          openai-api-key: ${{ secrets.openai_api_key }}

  override:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ai-review-override'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # This job has a write token. Never check out the PR.
      - uses: Kong/volcano-actions/.github/actions/ai-review@cd3c62db2fed8a93ba704dae434a9d477856fe2e
        with:
          step: override
