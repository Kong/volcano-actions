# This repository's own AI review: the first caller stub other Volcano
# repositories copy. See README.md.

name: AI Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  ai-review:
    uses: Kong/volcano-actions/.github/workflows/ai-review.yml@main
    with:
      hand_off: true
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_CI_API_KEY }}
      codex_access_token: ${{ secrets.CODEX_CI_ACCESS_TOKEN }}
  hand-off:
    needs: ai-review
    if: ${{ !cancelled() && needs.ai-review.outputs.hand-off == 'true' }}
    uses: Kong/volcano-actions/.github/workflows/ai-review-hand-off.yml@main
    permissions:
      contents: write
      pull-requests: write
      statuses: read
